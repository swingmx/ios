name: SwingMusicApp
options:
  bundleIdPrefix: com.swingmusic
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  LNPopupUI:
    url: https://github.com/LeoNatan/LNPopupUI
    exactVersion: "4.0.1"

schemes:
  SwingMusicApp:
    build:
      targets:
        SwingMusic: all
    run:
      target: SwingMusic
    test:
      targets:
        - SwingMusicTests
  SwingMusicWidgetsExtension:
    build:
      targets:
        SwingMusicWidgetsExtension: all
    run:
      target: SwingMusicWidgetsExtension

targets:
  SwingMusic:
    type: application
    platform: iOS
    sources:
      - SwingMusic
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.swingmusic.app
        PRODUCT_NAME: "Swing Music Client"
        CFBundleDisplayName: "Swing Music Client"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 11
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: SwingMusic/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SwingMusicWidgetsExtension
        embed: true
      - package: LNPopupUI
        embed: true
    entitlements:
      path: SwingMusic/SwingMusic.entitlements

  SwingMusicWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SwingMusic/Widget
        includes:
          - MusicWidget.swift
          - RecentlyPlayedWidget.swift
      - path: SwingMusic/LiveActivity
        includes:
          - MusicActivity.swift
          - MusicLiveActivity.swift
          - PlaybackControlIntents.swift
          - RecentTrack.swift
      - path: SwingMusic/Extensions
        includes:
          - Helpers.swift
      - path: SwingMusicWidgetExtension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.swingmusic.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 11
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: SwingMusicWidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: SwingMusicWidgetExtension/SwingMusicWidgetExtension.entitlements

  SwingMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwingMusicTests
    dependencies:
      - target: SwingMusic
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.swingmusic.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Swing Music Client.app/Swing Music Client"
        BUNDLE_LOADER: "$(TEST_HOST)"
